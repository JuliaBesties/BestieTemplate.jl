[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bestie-template"
version = "0.2.0"
description = "Python interface to the BestieTemplate copier template: add template features to Julia packages without Julia"
readme = "README.md"
requires-python = ">=3.11"
# Same license as the Julia package; LICENSE is a verbatim copy of the repo-root
# one (PEP 639 forbids ../ paths), kept honest by test_license_matches_the_repo
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Abel Soares Siqueira" }]
keywords = ["copier", "template", "julia", "bestie"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
]
dependencies = ["copier>=9.14,<10", "pyyaml>=6", "typer>=0.12"]

# The entry point is the Typer instance itself, not a main() wrapper.
# `bestie-template` is an alias of `bestie` so that `uvx bestie-template` works
# without `--from`: uvx runs the script whose name matches the package.
[project.scripts]
bestie = "bestie_template.cli:app"
bestie-template = "bestie_template.cli:app"

[project.urls]
Repository = "https://github.com/JuliaBesties/BestieTemplate.jl"
Documentation = "https://JuliaBesties.github.io/BestieTemplate.jl"

[dependency-groups]
dev = ["pytest>=8"]

# Dependency cooldown: ignore releases younger than the window, so a regression
# or a compromised upload has time to be caught before we resolve against it
[tool.uv]
exclude-newer = "1 week"

[tool.hatch.build.targets.wheel]
packages = ["src/bestie_template"]

# Copies the repo-root features.toml into the package (see hatch_build.py)
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "C4",  # comprehensions
  "SIM", # simplify
  "RUF", # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs the real copier against the local template checkout"]
