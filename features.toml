# Feature registry for `add_feature` — the single source of truth shared by the
# Julia package and future non-Julia interfaces (see docs/src/91-developer.md).
#
# Field semantics:
# - description: one line, user-facing; the `add_feature` docstring list is generated from it.
#   When a `required_fields` entry is not guessable (see below), say in the description how a
#   caller can tell what the value should be — usually a file whose presence implies it. This is
#   the only place that information reaches a user or an agent choosing the flags.
# - forced_data: answers always applied, highest priority in the data merge order
# - included_files: the only paths copier writes (everything else is excluded);
#   must be gated in the template on the forced_data flag(s). Always overwritten.
# - optional_files: optional; maps a boolean field to files that the feature's own output needs
#   when that field is true (e.g. the `link-checker` job reads `.lychee.toml`). Each is written
#   only if it does not already exist, so a file the user has tuned is never overwritten and two
#   features may safely declare the same path — whichever runs first writes it. Declare a file
#   here only if this feature's rendered output references it; do not consider which other
#   feature "owns" it. Non-boolean fields are not supported. Keys must be fields the caller can
#   set — a required_fields or forced_data entry — so the file follows from a stated intent
#   rather than reappearing after a user deleted it on purpose.
# - required_fields: answer keys that must be resolvable or the operation errors.
#   Resolution order is guessed data (Julia only, see `_read_data_from_existing_path` in
#   `src/guess.jl`) -> `.copier-answers.yml` -> the caller's `data`/`-d` flags. Guessing only
#   covers facts readable off the package: PackageName, PackageUUID, Authors, JuliaMinVersion,
#   PackageOwner, JuliaIndentation. Anything else has to be stated by the caller.
# - requires_answers: true = `.copier-answers.yml` must exist in the destination. Use this only
#   when a `required_fields` entry falls outside what guessing covers (limited to the facts
#   listed above; the Python CLI never guesses at all) and no sane default exists. See the
#   `_explicit` convention in docs/src/91-developer.md before adding one.
# - alias_of: this feature is an alias of another entry (no other fields allowed)

schema_version = 1

[features.agents]
description = "Adds `AGENTS.md` with guidance for AI coding agents; an existing `AGENTS.md` is kept unchanged"
forced_data = { AddAgentsMd = true }
included_files = ["AGENTS.md"]
required_fields = ["PackageName"]
requires_answers = false

[features.changelog]
description = "Adds `CHANGELOG.md` following the Keep a Changelog format"
forced_data = { AddChangelog = true }
included_files = ["CHANGELOG.md"]
required_fields = ["PackageOwner", "PackageName"]
requires_answers = false

[features.dependabot]
description = "Adds `.github/dependabot.yml` with auto-updates for GitHub Actions versions and Julia compat entries"
forced_data = { AddDependabot = true, GitHubActionVersionAutoUpdate = "dependabot", JuliaCompatAutoUpdate = "dependabot" }
included_files = [".github/dependabot.yml"]
required_fields = ["PackageName"]
requires_answers = false

[features.lint_action]
description = "Adds the `.github/workflows/Lint.yml` GitHub Actions workflow, reusing the package's recorded answers to decide which tools it runs (requires `.copier-answers.yml`)"
forced_data = { AddLintCI = true }
included_files = [".github/workflows/Lint.yml"]
required_fields = []
requires_answers = true

[features.lint_action_explicit]
description = "Adds the `.github/workflows/Lint.yml` GitHub Actions workflow to any package, taking as explicit data the answers that say which tools the package uses: `AddPrecommit` (pre-commit) and `AddLychee` (the Lychee link checker). The workflow runs one job per enabled tool, so at least one answer must be true or it renders with no jobs. Each enabled tool's config file (`.pre-commit-config.yaml`, `.lychee.toml`) is created only if missing, so an existing one is kept as is. An existing config file means the package already uses that tool and the answer is true; no config file means only that it does not use it yet, so ask before deciding"
forced_data = { AddLintCI = true }
included_files = [".github/workflows/Lint.yml"]
optional_files = { AddPrecommit = [".pre-commit-config.yaml"], AddLychee = [".lychee.toml"] }
required_fields = ["AddPrecommit", "AddLychee"]
requires_answers = false

[features.pre_commit]
alias_of = "pre_commit_with_config"

[features.pre_commit_with_config]
description = "Adds `.pre-commit-config.yaml` and the formatter/linter configuration files"
forced_data = { AddPrecommit = true, AddFormatterAndLinterConfigFiles = true }
included_files = [
  ".pre-commit-config.yaml",
  ".JuliaFormatter.toml",
  ".editorconfig",
  ".yamlfmt.yml",
  ".yamllint.yml",
  ".markdownlint.json",
]
required_fields = []
requires_answers = false

[features.pre_commit_without_config]
description = "Adds only `.pre-commit-config.yaml`, without the formatter/linter configuration files"
forced_data = { AddPrecommit = true, AddFormatterAndLinterConfigFiles = true }
included_files = [".pre-commit-config.yaml"]
required_fields = []
requires_answers = false

[features.testitem_cli]
description = "Updates `test/runtests.jl` to the `testitem_cli` testing strategy (filterable CLI test runner). Follow-up migration needed: existing tests must move to `@testitem` blocks and `test/Project.toml` must exist with the test dependencies (including `TestItemRunner`)"
forced_data = { TestingStrategy = "testitem_cli" }
included_files = ["test/runtests.jl"]
required_fields = []
requires_answers = false
