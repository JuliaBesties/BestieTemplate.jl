name: TestPython

# The template paths matter because the integration tests render the real
# template. GitHub Actions does not support YAML anchors, hence the duplication.
on:
  push:
    branches:
      - main
    paths:
      - "python/**"
      - features.toml
      - "template/**"
      - "copier/**"
      - copier.yml
      - .github/workflows/TestPython.yml
  pull_request:
    paths:
      - "python/**"
      - features.toml
      - "template/**"
      - "copier/**"
      - copier.yml
      - .github/workflows/TestPython.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
        with:
          # The integration tests run copier against this checkout, and copier
          # warns on shallow template clones
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest
      - name: Build and smoke-test the wheel
        run: |
          uv build --wheel
          uv run --isolated --no-project --with dist/*.whl bestie list-features --json > /dev/null
